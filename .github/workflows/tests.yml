name: tests

# 113 passing tests that nobody runs automatically will rot. This is the floor:
# every push and every pull request migrates a real database from scratch and
# runs the suite against it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Matches composer.json's "php": "^8.2" and the 8.2 the project runs
          # on locally under XAMPP.
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, gd, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The suite runs on in-memory SQLite (see phpunit.xml). That is the whole
      # reason this step matters: it is a different driver from the MySQL the
      # app runs on, so a migration or a query that only works on one of them
      # fails here rather than in front of the front desk. A CONCAT() in a
      # migration got through exactly this gap once.
      - name: Run tests
        run: php artisan test

  # Cheap, and it catches the class of mistake that a green test suite does
  # not: a Blade file that compiles but is not valid PHP.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Pint needs the merge base to work out what this PR actually
          # touched; the default shallow clone does not have it.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP sources
        run: find app config database routes tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      # Style, on files this PR ADDS. Not on files it modifies — see below.
      #
      # Pint was a dev dependency that had never been run, so the tree carries
      # a backlog: 177 issues under the bare `laravel` preset, and 122 once
      # pint.json turns off the rules that fight this codebase's deliberate
      # `=>` and `=` column alignment (see that file). Gating modified files
      # would therefore fail a PR for whatever backlog its files happened to
      # be carrying, which trains people to ignore the check.
      #
      # Added files have no backlog by definition, so this can never fail
      # spuriously, and it stops the pile growing. Widening to --diff-filter=ACMR
      # is the follow-up, and it needs one `./vendor/bin/pint` reformat commit
      # first; with pint.json in place that reformat is now safe to make.
      #
      # Deliberately separate from the `php -l` step above: that one must keep
      # running over everything, since a parse error anywhere breaks the app.
      - name: Install Pint
        if: github.event_name == 'pull_request'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check style of added files
        if: github.event_name == 'pull_request'
        run: |
          FILES=$(git diff --name-only --diff-filter=A \
            "origin/${{ github.base_ref }}...HEAD" -- '*.php')
          if [ -z "$FILES" ]; then
            echo "No PHP files added."
            exit 0
          fi
          echo "$FILES"
          echo "$FILES" | xargs ./vendor/bin/pint --test
